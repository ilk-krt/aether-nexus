name: Gölge Bot Otonom Çalıştırıcı

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı otomatik çalışır
  workflow_dispatch: # Manuel tetikleme imkanı

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır
        run: python bot.py

      - name: Veritabanını Kaydet ve Push Et
        run: |
          git config --global user.name 'AetherBot'
          git config --global user.email 'bot@aether.com'
          git add portfolio_db.json
          git commit -m "Auto-update portfolio db" || exit 0
          git push
